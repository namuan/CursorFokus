name: CursorFokus
options:
  bundleIdPrefix: com.github.namuan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftLintPlugin:
    url: https://github.com/realm/SwiftLint
    from: 0.55.0

targets:
  CursorFokus:
    type: application
    platform: macOS
    sources:
      - path: CursorFokus
    resources:
      - path: CursorFokus/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.namuan.cursorfokus
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: CursorFokus/Resources/CursorFokus.entitlements
    info:
      path: SupportingFiles/CursorFokus.Info.plist
      properties:
        CFBundleDisplayName: CursorFokus
        LSMinimumSystemVersion: "14.0"
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugin

  CursorFokusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CursorFokusTests
    dependencies:
      - target: CursorFokus
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  CursorFokusUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: CursorFokusUITests
    dependencies:
      - target: CursorFokus
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CursorFokus:
    build:
      targets:
        CursorFokus: all
        CursorFokusTests: [test]
        CursorFokusUITests: [test]
    test:
      targets:
        - CursorFokusTests
        - CursorFokusUITests
    run:
      config: Debug
